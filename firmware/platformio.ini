; ===========================================================================
;  Baby Shaker V1 - ESP32-C3 SuperMini + 270 deg servo + USB power bank
;
;  Rocks a stroller by swinging a servo arm against the wheel. Controlled
;  over BLE from the Web Bluetooth app in ../app (Android Chrome / iOS Bluefy).
; ===========================================================================

[env:esp32c3_supermini]
; Locally installed espressif32 = pioarduino (Arduino core 3.x): needed for
; the ledcAttach() API and the C3 native USB-CDC.
platform = espressif32
; Pin the Arduino core by URL: PlatformIO keeps URL packages in their own
; folder. Otherwise another project on this PC that uses the old espressif32@6
; platform overwrites the shared framework-arduinoespressif32 with core 2.0.17.
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
    framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11-libs.tar.xz
board = esp32-c3-devkitm-1
framework = arduino

; No OTA here - single app slot leaves room for the BLE stack.
board_build.partitions = huge_app.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; The SuperMini's serial port is the USB-JTAG peripheral; DTR/RTS reset it.
monitor_rts = 0
monitor_dtr = 0

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=1

lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0
