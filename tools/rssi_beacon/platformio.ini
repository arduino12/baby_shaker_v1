; ===========================================================================
;  RSSI beacon - compare ESP32-C3 modules' antennas.
;
;  Every module runs this same firmware: it advertises as "RSSI xxxx" at a
;  fixed power and rate, and listens to all other "RSSI" / "Baby Shaker"
;  modules, printing per-peer RSSI statistics every 2 s. The PC scans them
;  too (tools/rssi_compare.py). Same partition table as the Baby Shaker, so
;  its NVS (settings, calibration) is left alone.
; ===========================================================================

[platformio]
; Own package folder for the pioarduino platform (Arduino core 3.x). Projects on
; the old espressif32@6 platform (core 2.0.17, e.g. esp32_solar_system) install
; into the default folder under the SAME names, and each build overwrote the
; other's core - "TypeError: expected str ... NoneType" on the next build here.
packages_dir = ${platformio.core_dir}/packages-pioarduino

[env:esp32c3]
platform = espressif32
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
    framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11-libs.tar.xz
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0

; Boards whose USB port is a USB-UART chip (e.g. ESP-C3-01M kit with a CH340):
; Serial is UART0 there, not the C3's native USB.
[env:esp32c3_uart]
extends = env:esp32c3
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
