<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Baby Shaker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Baby Shaker <span class="ver">V1</span></h1>
    <span id="connState" class="pill">Disconnected</span>
  </header>

  <main>
    <section class="card" id="connectCard">
      <div class="row">
        <select id="deviceSelect" hidden></select>
        <button id="connectBtn" class="primary">Connect</button>
      </div>
      <p id="hint" class="hint"></p>
    </section>

    <section class="card" id="statusCard" hidden>
      <div class="stats">
        <div><span class="label">Mode</span><span id="stMode" class="value">—</span></div>
        <div><span class="label">Battery</span><span id="stVbat" class="value">—</span></div>
        <div><span class="label">Position</span><span id="stPos" class="value">—</span></div>
        <div><span class="label">Remaining</span><span id="stRemain" class="value">—</span></div>
      </div>
      <div class="modes" role="group" aria-label="Mode">
        <button data-mode="0">Off</button>
        <button data-mode="1">Manual</button>
        <button data-mode="2">Auto</button>
      </div>
    </section>

    <section class="card" id="manualCard" hidden>
      <label class="slider">
        <span>Position (degrees): <b id="posVal">135</b></span>
        <input id="pos" type="range" min="0" max="270" step="1" value="135">
      </label>
      <p class="hint">Returns to Off after 1 minute without movement.</p>
    </section>

    <section class="card" id="autoCard" hidden>
      <label class="field">
        <span>Movement Profile:</span>
        <select id="profile">
          <option value="0">Trapezoidal</option>
          <option value="1">S-Curve</option>
          <option value="2">Sinusoidal</option>
          <option value="3">Cubical</option>
        </select>
      </label>
      <label class="slider">
        <span>Speed (degrees/sec): <b id="speedVal"></b></span>
        <input id="speed" type="range" min="0" max="360" step="1">
      </label>
      <label class="slider">
        <span>Acceleration (degrees/sec²): <b id="accelVal"></b></span>
        <input id="accel" type="range" min="0" max="1000" step="5">
      </label>
      <label class="slider">
        <span>Travel (degrees): <b id="travelVal"></b></span>
        <input id="travel" type="range" min="10" max="270" step="1">
      </label>
      <label class="slider">
        <span>Hold Time (sec): <b id="holdVal"></b></span>
        <input id="hold" type="range" min="0" max="20" step="0.1">
      </label>
      <label class="slider">
        <span>Duration (minutes): <b id="durationVal"></b> <em id="durationRemain"></em></span>
        <input id="duration" type="range" min="0" max="120" step="1">
      </label>
    </section>
  </main>

  <footer>By Arad &amp; Claud 2026 ©</footer>

  <script src="app.js"></script>
</body>
</html>
