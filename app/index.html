<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Baby Shaker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css?v=1.5.2">
</head>
<body>
  <header>
    <h1>Baby Shaker <span class="ver">V1</span></h1>
    <button id="langBtn" class="lang" data-i18n="langBtn">עברית</button>
  </header>

  <main>
    <section class="card" id="connectCard">
      <div class="row">
        <select id="deviceSelect" hidden></select>
        <button id="connectBtn" class="go">Connect</button>
      </div>
      <p id="hint" class="hint"></p>
      <p id="flagTip" class="hint" data-i18n="flagTip" hidden></p>
    </section>

    <section class="card" id="statusCard" hidden>
      <div class="stats">
        <div><span class="label" data-i18n="battery">Battery</span><span id="stVbat" class="value" dir="ltr">—</span></div>
        <div id="posTile" class="pressable"><span class="label" data-i18n="position">Position</span><span id="stPos" class="value" dir="ltr">—</span></div>
        <div><span class="label" data-i18n="remaining">Remaining</span><span id="stRemain" class="value" dir="ltr">—</span></div>
      </div>
      <div id="signal" class="signal" hidden>
        <span id="sigBars" class="bars"></span>
        <span class="label" data-i18n="signal">Signal</span>
        <span id="sigText" class="sig-text"></span>
      </div>
      <div class="modes" role="group" aria-label="Mode">
        <button class="wide" data-mode="0" data-i18n="off">Off</button>
        <button class="wide" data-mode="1" data-i18n="manual">Manual</button>
        <button data-mode="2" data-slot="0">Auto 1</button>
        <button data-mode="2" data-slot="1">Auto 2</button>
        <button data-mode="2" data-slot="2">Auto 3</button>
        <button data-mode="2" data-slot="3">Auto 4</button>
      </div>
    </section>

    <section class="card" id="manualCard" hidden>
      <label class="slider">
        <span><span data-i18n="posLabel">Position (degrees):</span> <b id="posVal">135</b></span>
        <input id="pos" type="range" min="0" max="270" step="1" value="135">
      </label>
      <div id="manualMotion" class="sub-fields">
        <label class="field">
          <span data-i18n="profile">Movement Profile:</span>
          <select id="mProfile">
            <option value="0" data-i18n="trapezoidal">Trapezoidal</option>
            <option value="1" data-i18n="scurve">S-Curve</option>
            <option value="2" data-i18n="sinusoidal">Sinusoidal</option>
            <option value="3" data-i18n="cubical">Cubical</option>
          </select>
        </label>
        <label class="slider">
          <span><span data-i18n="speed">Speed (degrees/sec):</span> <b id="mSpeedVal"></b></span>
          <input id="mSpeed" type="range" min="5" max="360" step="1">
        </label>
        <label class="slider">
          <span><span data-i18n="accel">Acceleration (degrees/sec²):</span> <b id="mAccelVal"></b></span>
          <input id="mAccel" type="range" min="10" max="1000" step="5">
        </label>
      </div>
      <p class="hint" data-i18n="manualHint">Returns to Off after 1 minute without movement.</p>
    </section>

    <section class="card" id="autoCard" hidden>
      <label class="field">
        <span data-i18n="profile">Movement Profile:</span>
        <select id="profile">
          <option value="0" data-i18n="trapezoidal">Trapezoidal</option>
          <option value="1" data-i18n="scurve">S-Curve</option>
          <option value="2" data-i18n="sinusoidal">Sinusoidal</option>
          <option value="3" data-i18n="cubical">Cubical</option>
        </select>
      </label>
      <label class="slider">
        <span><span data-i18n="speed">Speed (degrees/sec):</span> <b id="speedVal"></b></span>
        <input id="speed" type="range" min="0" max="360" step="1">
      </label>
      <label class="slider">
        <span><span data-i18n="accel">Acceleration (degrees/sec²):</span> <b id="accelVal"></b></span>
        <input id="accel" type="range" min="0" max="1000" step="5">
      </label>
      <label class="slider">
        <span><span data-i18n="travel">Travel (degrees):</span> <b id="travelVal"></b></span>
        <input id="travel" type="range" min="10" max="270" step="1">
      </label>
      <label class="slider">
        <span><span data-i18n="hold">Hold Time (sec):</span> <b id="holdVal"></b></span>
        <input id="hold" type="range" min="0" max="20" step="0.1">
      </label>
      <label class="slider">
        <span><span data-i18n="duration">Duration (minutes):</span> <b id="durationVal"></b> <em id="durationRemain"></em></span>
        <input id="duration" type="range" min="0" max="120" step="1">
      </label>
      <button id="saveBtn">Save</button>
    </section>

    <section class="card" id="fwCard" hidden>
      <span class="card-title" data-i18n="fwTitle">Firmware update</span>
      <p id="fwText" class="hint"></p>
      <progress id="fwBar" max="1" value="0" hidden></progress>
      <button id="fwBtn" class="primary">Update firmware</button>
    </section>

    <section class="card" id="usageCard" hidden>
      <span class="card-title" data-i18n="usage">Statistics</span>
      <div class="usage">
        <div class="pressable" data-reset="0"><span class="label" data-i18n="last24h">Last 24 hours</span><span class="value" id="u0">—</span><span class="sub" id="u0t"></span></div>
        <div class="pressable" data-reset="1"><span class="label" data-i18n="last30d">Last 30 days</span><span class="value" id="u1">—</span><span class="sub" id="u1t"></span></div>
        <div class="pressable" data-reset="2"><span class="label" data-i18n="allTime">All time</span><span class="value" id="u2">—</span><span class="sub" id="u2t"></span></div>
      </div>
      <p class="hint" data-i18n="usageHint">Long-press a box to reset it.</p>
    </section>
  </main>

  <footer>
    <span data-i18n="credit">By Arad &amp; Claud 2026 ©</span>
    <span id="versions" class="versions"></span>
  </footer>

  <script src="app.js?v=1.5.2"></script>
</body>
</html>
